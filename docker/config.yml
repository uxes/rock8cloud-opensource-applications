port: 3000
bindIP: 0.0.0.0
db:
  type: $(DB_TYPE)
  # Points at the local stunnel proxy (see docker/entrypoint.sh), not the
  # real DB_HOST/DB_PORT directly - Wiki.js has no way to express "TLS but
  # don't validate the cert" for the actual Postgres connection, so the
  # proxy does that hop instead and Wiki.js talks plaintext to it locally.
  host: '127.0.0.1'
  port: 15432
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  storage: $(DB_FILEPATH)
  ssl: false
ssl:
  enabled: $(SSL_ACTIVE)
  port: 3443
  provider: letsencrypt
  domain: $(LETSENCRYPT_DOMAIN)
  subscriberEmail: $(LETSENCRYPT_EMAIL)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:default)
ha: $(HA_ACTIVE)
